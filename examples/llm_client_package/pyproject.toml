[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "acme-llm"
version = "1.0.0"
description = "Example LLM client package for the TestBench AI Service"
requires-python = ">=3.11"
# The service does not install dependencies for you: a package is a self-contained wheel.
# List only what the service environment already ships.
dependencies = []

# The service finds the LLM clients of a package through this entry-point group.
# <client name> = "<module>.<submodule>:<LLMClientClass>"
[project.entry-points."testbench_ai_service.llm_clients"]
acme_llm = "acme_llm.client:AcmeLLMClient"

[tool.flit.module]
name = "acme_llm"
