repos:
  # mypy linter for Python files
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        description: 'Run mypy for static type checking'
        entry: mypy
        language: python
        types_or: [python, pyi]
        require_serial: true

  # Ruff linter for Python files
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        description: "Run 'ruff format' for extremely fast Python formatting"
        entry: ruff format --force-exclude
        language: python
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff
        name: ruff
        description: "Run 'ruff' for extremely fast Python linting"
        entry: ruff check --force-exclude
        language: python
        types_or: [python, pyi, jupyter]
        require_serial: true

  # Prettier for the web console, using the version pinned in frontend/
  # (needs `npm install` in frontend/ first)
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        description: 'Format the frontend sources with Prettier'
        entry: node frontend/node_modules/prettier/bin/prettier.cjs --write
        language: system
        files: ^frontend/src/.*\.(ts|tsx|css)$
