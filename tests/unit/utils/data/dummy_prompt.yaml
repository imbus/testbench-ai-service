name: "TestCaseSetReviewer"
description: "Dummy test prompt for unit testing."
default_variant: "ENG"
default_model: "o4-mini-2025-04-16"
variants:
  - name: "ENG"
    model: "o4-mini-2025-04-16"
    vars:
      glossary:
        name: "Glossary"
        value_type: "text"
        required: false
      test_case_set_description:
        name: "Test Case Set Description"
        value_type: "text"
        required: false
    messages:
      - role: "system"
        text: |
          You will receive a blueprint from which executions are derived but will not have access to all executions.

      - role: "user"
        text: |
          {% if vars.glossary %}
          Additional Review Criterion - Glossary:
          {{ vars.glossary }}
          {% endif %}
          {% if vars.test_case_set_description %}
          Additional Review Criterion - Description Appropriateness:
          {{ vars.test_case_set_description }}
          {% endif %}
          Review the following test case:
          {{ agent.test_case }}

  - name: "DEU"
    model: "o4-mini-2025-04-16"
    messages:
      - role: "user"
        text: |
          Prüfe den folgenden Testfall:
          {{ agent.test_case }}
