name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff format
        run: ruff format --check --diff .

      - name: ruff check
        run: ruff check --output-format github .

      - name: mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest and highest Python version declared in pyproject.toml.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      # prompt_engineering tests need real LLM API keys and are excluded here.
      - name: pytest
        run: pytest -m "not prompt_engineering" -ra

  install-check:
    name: Installation check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Build wheel
        run: |
          pip install flit
          flit build --format wheel

      # Install the built wheel (not the source tree) into a clean venv outside
      # the checkout, so missing package data or entry points show up here.
      - name: Install wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then
            VENV_BIN="$RUNNER_TEMP/venv/Scripts"
          else
            VENV_BIN="$RUNNER_TEMP/venv/bin"
          fi
          echo "VENV_BIN=$VENV_BIN" >> "$GITHUB_ENV"
          "$VENV_BIN/python" -m pip install --upgrade pip
          "$VENV_BIN/python" -m pip install dist/*.whl
          "$VENV_BIN/python" -m pip check

      # `start` and load_config_from_file() are intentionally not run: both
      # validate tb_server_url against a reachable TestBench server.
      - name: Smoke-test installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          "$VENV_BIN/testbench-ai-service" --version
          "$VENV_BIN/testbench-ai-service" --help
          "$VENV_BIN/testbench-ai-service" init \
            --path smoke/config.toml \
            --prompts-dir smoke/prompts \
            --templates-dir smoke/templates

          test -s smoke/config.toml
          test -n "$(find smoke/prompts -name 'prompt.yaml' -print -quit)"
          test -n "$(find smoke/templates -type f -print -quit)"

          "$VENV_BIN/python" -c "import tomllib; tomllib.load(open('smoke/config.toml', 'rb')); print('config.toml is valid TOML')"
