# yaml-language-server: $schema=../../prompt.schema.json

name: "Test-Planer"
summary: "Testauswahl für einen Zyklus vorschlagen"
description: >
  Dieser Agent wählt aus dem Zyklus die Testfälle aus, die sich inhaltlich am
  stärksten voneinander unterscheiden, sodass mit wenigen Tests möglichst viel
  Funktionalität abgedeckt wird. Die ausgewählten Testfälle werden im Zyklus
  auf Planned gesetzt; das Ergebnis steht im Log des Service.
default_model: "text-embedding-3-small"
default_variant: "Automatisch"
variants:
  - name: "Automatisch"
    description: "Wählt bis zu dem Punkt aus, ab dem jeder weitere Test deutlich weniger Neues bringt."
    vars:
      existing: &existing
        name: "Bestehende Planung"
        description: "keep: bereits geplante Testfälle bleiben gesetzt und werden ergänzt. replan: die Auswahl beginnt ohne die bestehende Planung."
        value_type: "enum"
        choices: ["keep", "replan"]
        default_value: "keep"
        required: false
      knee_percent:
        name: "Auswahlgröße (% des Knicks)"
        description: "100 endet am Knick. Höhere Werte wählen mehr Testfälle aus, niedrigere weniger, z. B. 150 = anderthalbmal so viele."
        value_type: "number"
        minimum: 1
        default_value: 100
        required: false
    messages: []
  - name: "Anzahl"
    description: "Wählt eine feste Anzahl von Testfällen aus."
    vars:
      existing: *existing
      count:
        name: "Anzahl Testfälle"
        value_type: "number"
        minimum: 1
        default_value: 40
        required: false
    messages: []
  - name: "Zeitbudget"
    description: "Wählt aus, bis die geplanten Ausführungsdauern das Budget erreichen."
    vars:
      existing: *existing
      budget_minutes:
        name: "Zeitbudget (Minuten)"
        value_type: "number"
        minimum: 1
        default_value: 240
        required: false
    messages: []
  - name: "Requirement-Abdeckung"
    description: "Wählt aus, bis der Anteil abgedeckter Requirements den Zielwert erreicht."
    vars:
      existing: *existing
      coverage_percent:
        name: "Ziel-Abdeckung (%)"
        value_type: "number"
        minimum: 1
        maximum: 100
        default_value: 100
        required: false
    messages: []
