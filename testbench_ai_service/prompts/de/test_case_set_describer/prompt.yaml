# yaml-language-server: $schema=../../prompt.schema.json

name: "Testfallsatz-Beschreiber"
summary: "Testfallsatz-Beschreibungen generieren"
description: >
  Dieser Agent generiert Beschreibungen für die angegebenen Testfallsätze.
  Die generierten Beschreibungen werden in das Beschreibungsfeld der jeweiligen
  Testfallsatz-Spezifikationen eingefügt.
default_model: "gpt-5.4"
default_variant: "Vollständige Beschreibung"
variants:
  - name: "Vollständige Beschreibung"
    description: "Erstellt eine strukturierte Beschreibung mit drei Abschnitten: Testziel, wichtigste Überprüfungen und eine Zusammenfassung jedes konkreten Testfalls. Empfohlen für vollständige Dokumentation."
    model: "gpt-5.4"
    messages:
      - role: "system"
        file: "beschreibung_system.jinja"
      - role: "user"
        file: "vollstaendige_beschreibung_user.jinja"
  - name: "Kurzbeschreibung"
    description: "Erstellt ausschließlich das Testziel als einzelner Satz. Schnell und kosteneffizient; ideal wenn eine kurze Beschriftung benötigt wird."
    model: "gpt-5.4-mini"
    messages:
      - role: "system"
        file: "beschreibung_system.jinja"
      - role: "user"
        file: "kurzbeschreibung_user.jinja"
