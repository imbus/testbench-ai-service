# yaml-language-server: $schema=../../prompt.schema.json

name: "Link-Finder"
summary: "Findet TestCaseSets, die eine Anforderung prüfen, aber nicht mit ihr verlinkt sind"
description: >
  Dieser Agent zerlegt die Anforderung, auf der er ausgelöst wurde, in prüfbare Aspekte,
  sichtet alle nicht verlinkten TestCaseSets der Testobjektversion nach Kandidaten und liest
  deren Testschritte gegen die Aspekte. Jeder Kandidat erhält einen Hinweis im
  Review-Kommentar; die vollständige Liste wird ins Service-Log geschrieben. Verknüpfungen
  werden nie gesetzt: Über jeden Vorschlag entscheidet ein Mensch.
default_model: "gpt-5.5"
default_variant: "Link-Suche"
variants:
  - name: "Link-Suche"
    description: "Durchsucht die ganze Testobjektversion nach nicht verlinkten TestCaseSets, die die Anforderung prüfen."
    vars:
      write_review_comments:
        name: "Review-Kommentare schreiben"
        description: "Aus: Das Ergebnis geht nur ins Service-Log."
        value_type: "boolean"
        default_value: true
        required: false
      min_confidence_for_comment:
        name: "Mindestkonfidenz für einen Kommentar"
        description: "Kandidaten unter dieser Konfidenz erscheinen nur im Service-Log."
        value_type: "enum"
        choices: ["high", "medium", "low"]
        default_value: "low"
        required: false
    messages: []
    steps:
      aspects:
        - role: "system"
          file: "aspekte_system.jinja"
        - role: "user"
          file: "aspekte_user.jinja"
      prefilter:
        - role: "system"
          file: "vorfilter_system.jinja"
        - role: "user"
          file: "vorfilter_user.jinja"
      interpretation:
        - role: "system"
          file: "interpretation_system.jinja"
        - role: "user"
          file: "interpretation_user.jinja"
