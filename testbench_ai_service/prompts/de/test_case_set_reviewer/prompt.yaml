# yaml-language-server: $schema=../../prompt.schema.json

name: "Testfallsatz-Reviewer"
summary: "Testfallsätze reviewen"
description: >
  Dieser Agent führt Reviews für die angegebenen Testfallsätze durch.
  Die Review-Ergebnisse werden als Review-Anmerkungen in das entsprechende Feld
  der jeweiligen Testfallsatz-Spezifikationen eingetragen.
default_model: "gpt-5.4"
default_variant: "Umfassende Prüfung"
variants:
  - name: "Umfassende Prüfung"
    description: "Umfassende ISTQB/ISO 29119-Qualitätsprüfung. Prüft Benennung, Beschreibung, Schrittformulierung, Validierungsabdeckung und Konsistenz. Nutzt die Trennung in System- und Nutzernachricht für beste Ergebnisse mit GPT-Chat-Modellen."
    model: "gpt-5.4"
    vars:
      glossary:
        name: "Glossar"
        description: "Optionales Glossar projektspezifischer Schlüsselwörter. Bei Angabe werden Testschrittnamen auf Compliance geprüft."
        value_type: "text"
        required: false
    messages:
      - role: "system"
        file: "umfassende_pruefung_system.jinja"
      - role: "user"
        file: "umfassende_pruefung_user.jinja"
  - name: "Kompakte Prüfung"
    description: "Kompakte Strukturprüfung mit Fokus auf fehlende Validierungsschritte, generische Namen, falsche Schrittform und Glossarabweichungen, wenn ein Glossar vorliegt. Schnell und kosteneffizient; geeignet für hohe Verarbeitungslast."
    model: "gpt-5.4-mini"
    vars:
      glossary:
        name: "Glossar"
        description: "Optionales Glossar projektspezifischer Schlüsselwörter. Bei Angabe werden Testschrittnamen auf Compliance geprüft."
        value_type: "text"
        required: false
    messages:
      - role: "user"
        file: "kompakte_pruefung_user.jinja"
