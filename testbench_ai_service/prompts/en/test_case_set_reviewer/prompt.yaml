# yaml-language-server: $schema=../../prompt.schema.json

- name: "TestCaseSetReviewer"
  description: >
    Reviews test case sets based on defined quality criteria. Supports optional glossary integration
    via template blocks. One variant uses a single user block (optimized for reasoning models);
    the other uses separate system and user blocks.
  default_model: "gpt-5.4"
  default_variant: "Single Block"
  variants:
    - name: "Single Block"
      description: "Delivers all instructions in a single user message; best suited for reasoning models that don't support a system role."
      model: "gpt-5.4"
      vars:
        glossary:
          name: "Glossary"
          description: "Optional glossary of project-specific keyword terms. When provided, test steps are checked against it."
          value_type: "text"
          required: false
      messages:
        - role: "user"
          file: "single_block.jinja"

    - name: "Separated Roles"
      description: "Splits the prompt into system and user message blocks; best suited for chat models that support a system role."
      model: "gpt-5.2-pro"
      vars:
        glossary:
          name: "Glossary"
          description: "Optional glossary of project-specific keyword terms. When provided, test steps are checked against it."
          value_type: "text"
          required: false
      messages:
        - role: "system"
          file: "separated_roles_system.jinja"
        - role: "user"
          file: "separated_roles_user.jinja"
