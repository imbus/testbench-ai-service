# yaml-language-server: $schema=../../prompt.schema.json

name: "Link Finder"
summary: "Find test case sets that test a requirement but are not linked to it"
description: >
  This agent splits the requirement it was triggered on into testable aspects, screens every
  unlinked test case set of the test object version for candidates and reads their test steps
  against the aspects. Every candidate gets a hint in its review comment; the full list is
  written to the service log. Links are never set: a person decides on every suggestion.
default_model: "gpt-5.5"
default_variant: "Link search"
variants:
  - name: "Link search"
    description: "Searches the whole test object version for unlinked test case sets that test the requirement."
    vars:
      write_review_comments:
        name: "Write review comments"
        description: "Off: the result only goes to the service log."
        value_type: "boolean"
        default_value: true
        required: false
      min_confidence_for_comment:
        name: "Minimum confidence for a comment"
        description: "Candidates below this confidence only appear in the service log."
        value_type: "enum"
        choices: ["high", "medium", "low"]
        default_value: "low"
        required: false
    messages: []
    steps:
      aspects:
        - role: "system"
          file: "aspects_system.jinja"
        - role: "user"
          file: "aspects_user.jinja"
      prefilter:
        - role: "system"
          file: "prefilter_system.jinja"
        - role: "user"
          file: "prefilter_user.jinja"
      interpretation:
        - role: "system"
          file: "interpretation_system.jinja"
        - role: "user"
          file: "interpretation_user.jinja"
