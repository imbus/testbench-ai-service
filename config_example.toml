[testbench-ai-service]
tb_server_url = "https://localhost:9443/api/"
host = "127.0.0.1"
port = 8010
debug = false
prompts_dir = "C:\\TestBenchAIService\\prompts"
language = "de"

# Global llm configuration
[testbench-ai-service.llm_config]
provider = "openai"

# Global logging configuration for console logging
[testbench-ai-service.logging.console]
log_level = "INFO"
log_format = "%(levelname)s: %(message)s"

# Global logging configuration for file logging
[testbench-ai-service.logging.file]
file_name = "testbench-ai-service.log"
log_level = "DEBUG"
log_format = "%(asctime)s - %(levelname)8s - %(name)s - %(message)s"


# Global agent configurations

# Global agent configuration for test case set reviewer
[testbench-ai-service.agents.test_case_set_reviewer]
enabled = true
endpoint_path = "/test-case-set-reviews"
class_path = "testbench_ai_service.agents.test_case_set_reviewer.agent.TestCaseSetReviewer"
summary = "Trigger test case set reviews"
description = """This endpoint triggers asynchronous reviews for the specified test case sets.
The review results will be added as comments to the `reviewComment` attribute (review comments section) of corresponding test structure element specifications."""

# Global prompt configuration for test case set reviewer
[testbench-ai-service.agents.test_case_set_reviewer.prompt]
file = "test_case_set_reviewer/prompt.yaml"
name = "TestCaseSetReviewer"

# Optional: supply user-provided variables for prompt templates (accessible as {{ vars.<key> }})
# [testbench-ai-service.agents.test_case_set_reviewer.prompt.vars]
# glossary = "ABS = Anti-lock Braking System\nESC = Electronic Stability Control"

# Global agent configuration for test case set describer
[testbench-ai-service.agents.test_case_set_describer]
enabled = true
endpoint_path = "/test-case-set-descriptions"
class_path = "testbench_ai_service.agents.test_case_set_describer.agent.TestCaseSetDescriber"
summary = "Trigger generation of test case set descriptions"
description = """This endpoint triggers asynchronous generation of descriptions for the specified test case sets.
The generated descriptions will be assigned to their respective test structure element specifications."""

# Global prompt configuration for test case set describer
[testbench-ai-service.agents.test_case_set_describer.prompt]
file = "test_case_set_describer/prompt.yaml"
name = "TestCaseSetDescriber"

# Global agent configuration for defect explainer
[testbench-ai-service.agents.defect_explainer]
enabled = true
endpoint_path = "/defect-explanations"
class_path = "testbench_ai_service.agents.defect_explainer.agent.DefectExplainer"
summary = "Trigger generation of defect explanations"
description = """This endpoint triggers asynchronous generation of defect explanations for the specified test case sets.
            The generated explanations will be added to the comment section of the corresponding test structure element execution overview."""

# Global prompt configuration for defect explainer
[testbench-ai-service.agents.defect_explainer.prompt]
file = "defect_explainer/prompt.yaml"
name = "DefectExplainer"


# Project-specific configurations (override global configurations)

[testbench-ai-service.projects."Car Configurator"]
language = "en"

# Project-specific agent configuration for test case set reviewer (override global reviewer agent configuration)
[testbench-ai-service.projects."Car Configurator".agents.test_case_set_reviewer]
enabled = false

# Project-specific prompt configuration for test case set reviewer (override global reviewer prompt configuration)
[testbench-ai-service.projects."Car Configurator".agents.test_case_set_reviewer.prompt]
file = "CarConfigurator_reviews_prompt.yaml"
name = "TestCaseSetReviewer"
