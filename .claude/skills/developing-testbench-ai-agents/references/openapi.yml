            format: int64
        - name: labelKey
          in: path
          description: The identifier of the test label
          required: true
          schema:
            type: integer
            format: int64
        - name: force
          in: query
          required: false
          description: Force privatize attached test label.
          schema:
            type: boolean
            default: false
      requestBody:
        description: The updated name and visibility type of the new test label
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestLabelDataForUpdate'
      responses:
        '200':
          description: The test label data has been updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestLabel'
        '400':
          description: The request body structure is wrong.
        '403':
          description: >
            Forbidden: Updating the test label is not possible for one of the following reasons:
              - The user is neither an administrator nor a user with writing project role in the affected project.
              - The affected label should be updated and it belongs to another user and the current user is neither admin nor test manager.
        '404':
          description: >
            Not found: Updating the test label is not possible for one of the following reasons:
              - The project does not exist
              - The label does not exist
              - The label is private and is not owned by the current user
        '409':
          description: >
            Conflict: Updating the test label is not possible for one of the following reasons:
              - In case of a private label there already exists a label owned by the current user with the same name as the new trimmed one.
              - In case of a public label there already exists a public or private label owned by the current user with the same name as the trimmed new one.
              - In case of a public label there already exists a public label owned by another user with the same name as the trimmed one.
              - If the affected label should be made public and there already exists a public label with the same name as the updated one.
              - If the affected label should be made private, it is already attached to versions and the Force flag is set to false.
              - If the affected label should be made private, it is attached to a version by a different user.
              - If the affected label belongs to a library.
        '422':
          description: >
            Unprocessable entity:
            - Given test label name is empty or too long (<1 or > 255)

