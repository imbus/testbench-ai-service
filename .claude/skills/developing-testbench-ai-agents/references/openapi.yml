  /api/2/projects/{projectKey}/specifications/{specificationKey}:
    patch:
      tags:
        - Test Structure Elements
      summary: Updates the details of the given specification of the given project.
      description: This endpoint updates the details of the given specification of the given project. Only application admin or user with writing project roles can use this call. JWT Permission = "ModifySpecifications"
      operationId: updateSpecificationDetails
      security:
        - SessionToken: [ ]
        - JWTAuth: [ "ModifySpecifications" ]
      parameters:
        - name: projectKey
          in: path
          description: The identifier of the project.
          required: true
          schema:
            type: integer
            format: int64
        - name: specificationKey
          in: path
          description: The identifier of the specification.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: The specification details that should be updated.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecificationDetailsForUpdate'
      responses:
        '200':
          description: The specification details have been returned.
          content:
            application/vnd.testbench+json:
              schema:
                $ref: '#/components/schemas/SpecificationSummary'
        '403':
          description: >
            Forbidden: The action to update the specification is not possible due to one of the following reasons:
              - Current user is neither an administrator nor a user with writing role in the given project.
              - Designer is trying to update the priority or due date.
              - Tester or Programmer is trying to update the management information or the description.
        '404':
          description: >
            Not Found: The action to update the specification is not possible due to one of the following reasons:
              - Project not found.
              - Specification not found.
              - User that should be set as reviewer or responsible not found.
        '409':
          description: >
            Conflict: The action to update the specification is not possible due to one of the following reasons:
              - Specification is already locked by a logged in user.
              - Specification is already locked by a logged out user and the current user is neither administrator nor manager.
              - Specification is checked in.
              - Given user cannot be set as responsible.
              - Given user cannot be set as reviewer.
              - User other than current cannot be set as locker.
              - Current user is designer and he is neither responsible nor reviewer.
              - Tester or programmer is trying to update the locker or the review comments and he is not reviewer.

