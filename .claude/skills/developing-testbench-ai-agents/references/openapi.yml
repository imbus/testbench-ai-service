  /api/2/projects/{projectKey}/members:
    get:
      tags:
        - Projects
      summary: Returns the members of the given project.
      description: This endpoint returns the members of the given project. Only application admin, project admin or user with project roles can use this call. JWT Permission = "ReadProjectMembers"
      operationId: getProjectMembers
      security:
        - SessionToken: [ ]
        - JWTAuth: [ "ReadProjectMembers" ]
      parameters:
        - name: projectKey
          in: path
          description: The identifier of the project.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The project members have been returned.
          content:
            application/vnd.testbench+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
    patch:
      tags:
        - Projects
      summary: Updates the project roles of the given users in the given project in a single call.
      description: This endpoint updates the project roles of the given users in the given project in one request. Only the members named in the body are changed; the others are left untouched (hence PATCH). Only application admin, project admin or test manager in the given project can use this call. JWT Permission = "ModifyUserRolesInProject". Each assignment is validated and applied independently; a failing assignment is reported in its result entry and does not abort the others. A user listed more than once with conflicting roles is rejected for that user (its result is Failed) and none of its roles are applied, while the other users are still applied. Assignments that grant the test manager role are applied before all other assignments (regardless of their order in the request body), so the manager role can be handed from one user to another within a single request without violating the "at least one active test manager" rule; the results are still reported in request order. The JBoss cache is invalidated once for the whole request.
      operationId: updateProjectMembers
      security:
        - SessionToken: [ ]
        - JWTAuth: [ "ModifyUserRolesInProject" ]
      parameters:
        - name: projectKey
          in: path
          description: The identifier of the project.
          required: true
          schema:
            type: integer
            format: int64
        - name: force
          in: query
          required: false
          description: Force change project roles of users.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProjectRolesAssignments'
      responses:
        '200':
          description: The request has been processed. The body reports the per-user outcome (applied, unchanged or failed); a failed entry carries the error that prevented that user's change while the other users were still applied.
          content:
            application/vnd.testbench+json:
              schema:
                $ref: '#/components/schemas/UserProjectRolesResults'
        '403':
          description: >
            Forbidden
               - The user is not an administrator or project administrator.
               - The user is not a test manager in the given project.
        '404':
          description: >
            Not Found
              - Project not found.
  /api/2/projects/{projectKey}/members/{userKey}:
