      x-scalaType: 'enums.TestFilterType'
    FilteringOptions:
        type: object
        description: >-
          Restricts an export to part of the test structure. Mutually exclusive with the deprecated 'filters'
          parameter - providing both is rejected with 400.
        properties:
          appliedFilters:
            description: >-
              The filters to apply. When empty, no test-structure filtering is performed and 'excludedTestThemes'
              has no effect; only 'labelFilter', if set, still applies.
            type: array
            items:
              $ref: '#/components/schemas/FilterInfo'
          excludedTestThemes:
            description: >-
              UIDs of test themes that are exempt from the filters in 'appliedFilters' - such a theme and its test
              case set children are exported as if no filter were applied. Note this exempts from filtering; it
              does not exclude the themes from the export. By design the exemption reaches only the direct children
              of a listed theme, not deeper descendants: a test case set under a nested theme stays filtered unless
              that nested theme is listed too, so exempting a whole subtree means naming every theme in it. Has no
              effect on 'labelFilter', and ignored when 'appliedFilters' is empty.
            type: array
            items:
              type: string
          labelFilter:
            description: >-
              Name of a test label; restricts the export to the structure elements carrying it. Applied
              independently of 'appliedFilters' and not affected by 'excludedTestThemes'.
            type: string

    ImportFilteringOptions:
        type: object
        description: >-
          Restricts an execution-results import to part of the test structure. Mutually exclusive with the
          deprecated 'filters' parameter - providing both is rejected with 400.
        properties:
          appliedFilters:
            description: The filters to apply. When empty, no filtering is performed and 'excludedTestThemes' has no effect.
            type: array
            items:
              $ref: '#/components/schemas/FilterInfo'
          excludedTestThemes:
            description: >-
              UIDs of test themes that are exempt from the filters in 'appliedFilters' - such a theme and its test
              case set children are imported as if no filter were applied. Note this exempts from filtering; it does
              not exclude the themes from the import. By design the exemption reaches only the direct children of a
              listed theme, not deeper descendants: a test case set under a nested theme stays filtered unless that
              nested theme is listed too, so exempting a whole subtree means naming every theme in it. Ignored when
              'appliedFilters' is empty.
            type: array
            items:
              type: string

