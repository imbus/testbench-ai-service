              - The project is not found and the current user is not an administrator.
              - The user is not an administrator and has no writing role in the given project.
              - The user has only the global role project admin.
              - The label is public and it is not owned by the current user and the user is not an administrator neither a manager in the specific project.
        '404':
          description: >
            Not found: The action to delete the test label is not possible due to one of the following reasons:
              - Project not found and the current user is an administrator.
              - Test label not found.
              - The test label is private and is not owned by the current user.
        '409':
          description: >
            Conflict: The action to delete the test label is not possible due to one of the following reasons:
              - The affected test label is attached to at least one version.
              - The test label is a library label.
    patch:
      tags:
        - Labels
      summary: Updates the data of a test label and returns the updated test label.
      description: This endpoint updates the data of a test label and returns the updated test label. Only application admin or user with writing project roles can use this call. JWT Permission = "ModifyTestLabels"
      operationId: updateTestLabel
      security:
        - SessionToken: [ ]
        - JWTAuth: [ "ModifyTestLabels" ]
