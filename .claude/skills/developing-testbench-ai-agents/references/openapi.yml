paths:
  /api/2/login/session:
    post:
      tags:
        - Login
      summary: Logs on a TestBench user.
      description: This endpoint logs on a TestBench user into the system. Every TestBench user can use this call.
      operationId: postLoginSession
      requestBody:
        description: The login data.
        required: true
        content:
          application/vnd.testbench+json:
            schema:
              $ref: '#/components/schemas/LoginData'
            example:
              login: 'username'
              password: 'secret'
              force: false
      responses:
        '201':
          description: The response containing the login session.
          content:
            application/vnd.testbench+json:
              schema:
                $ref: '#/components/schemas/LoginSession'
        '409':
          description: Already logged in or password has to be changed.
    get:
      tags:
        - Login
      summary: Reads the login data of the user.
      description: This endpoint returns the login data of the TestBench user. Every TestBench user can use this call.
      operationId: getLoginSession
      security:
        - SessionToken: [ ]
      responses:
        '200':
          description: The response containing the login session.
          content:
            application/vnd.testbench+json:
              schema:
                $ref: '#/components/schemas/LoginSession'
    delete:
      tags:
        - Login
      summary: Logs out a TestBench user from the system.
      description: This endpoint logs out a TestBench user from the system. Every TestBench user can use this call.
      operationId: deleteLoginSession
      security:
        - SessionToken: [ ]
      responses:
        '204':
          description: The user has been logged out.
  /api/2/login/session/activeUsers:
    get:
      tags:
        - Login
      summary: Reads the active login sessions.
      description: This endpoint returns the active login sessions of all users. Every TestBench user can use this call. JWT Permission = "ReadUserSessions"
      operationId: getActiveUsers
      security:
        - SessionToken: [ ]
        - JWTAuth: [ "ReadUserSessions" ]
      responses:
        '200':
          description: The response containing the login sessions.
          content:
            application/vnd.testbench+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveUser'
    delete:
      tags:
        - Login
      summary: Logs out another TestBench user from the system.
      description: This endpoint logs out another TestBench user from the system. Only application admin can use this call. JWT Permission = "DeleteUserSession"
      operationId: logoutActiveUser
      security:
        - SessionToken: [ ]
        - JWTAuth: [ "DeleteUserSession" ]
      parameters:
        - name: login
          in: query
          description: The login of the active user.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The user has been logged out.
  /api/2/login/password:
    put:
      tags:
        - Login
      summary: Changes the own password.
      description: This endpoint changes the own password and resets eventually the flag 'password expired'.
      operationId: putOwnPassword
      requestBody:
        description: The password data.
        required: true
        content:
          application/vnd.testbench+json:
            schema:
              $ref: '#/components/schemas/ChangePasswordData'
      responses:
        '204':
          description: The password has been changed successfully.
        '409':
          description: Action not possible within external user management.
        '422':
          description: Password too long or is identical to old password.
  /api/2/jwt/token:
    post:
      tags:
        - JSON Web Token
      summary: Generate JWT access token
      description: Generates a JWT access token for the logged-in user based on requested scope and permissions.
      operationId: generateJWT
      security:
        - SessionToken: [ ]
      requestBody:
        description: The requested json web token data.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JWTDataOptions'
      responses:
        '200':
          description: JWT Access Token generated successfully
          content:
            application/vnd.testbench+json:
              schema:
                $ref: '#/components/schemas/JWTResponse'
        '400':
          description: Invalid request (missing permissions or invalid scope)
        '409':
          description: Requested permissions exceed users permissions
  /api/2/jwt/invalidate:
    post:
      tags:
        - JSON Web Token
      summary: Invalidate all JWT access tokens
      description: Invalidate all previously issued JWT tokens by refreshing the used signing secret.
      operationId: invalidateJWT
      security:
        - SessionToken: [ ]
        - JWTAuth: [ "AdministerServer" ]
      responses:
        '200':
          description: The used signing secret is refreshed
        '400':
          description: The server failed to execute the request
        '403':
          description: The user needs to have sufficient permissions to administer the server
  /api/2/projects/{projectKey}/cycles/{cycleKey}:
    get:
      tags:
        - Cycles
      summary: Returns the test cycle with the given key.
      description: This endpoint returns the test cycle with the given key. Only application admin, project admin or user with project roles can use this call. JWT Permission = "ReadProjectDetails"
      operationId: getCycleDetails
      security:
        - SessionToken: [ ]
        - JWTAuth: [ "ReadProjectDetails" ]
      parameters:
        - name: projectKey
          in: path
          description: The identifier of the project.
          required: true
          schema:
            type: integer
            format: int64
        - name: cycleKey
          in: path
          description: The identifier of the test cycle.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The test cycle has been returned.
          content:
            application/vnd.testbench+json:
              schema:
                $ref: '#/components/schemas/CycleDetails'
        '404':
          description: Project or test cycle not found.
    patch:
      tags:
        - Cycles
      summary: Returns the updated test cycle.
      description: This endpoint returns the updated test cycle. Only application admin, project admin or manager can use this call. JWT Permission = "ModifyProjectDetails"
      operationId: updateCycleDetails
      security:
        - SessionToken: [ ]
        - JWTAuth: [ "ModifyProjectDetails" ]
      parameters:
        - name: projectKey
          in: path
          description: The identifier of the project.
          required: true
          schema:
            type: integer
            format: int64
        - name: cycleKey
          in: path
          description: The identifier of the test cycle.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: The body of test object version.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleForUpdate'
      responses:
        '200':
          description: The test cycle has been returned.
          content:
            application/vnd.testbench+json:
              schema:
                $ref: '#/components/schemas/CycleResponse'
        '404':
          description: Project or test cycle not found.
        '403':
          description: Forbidden.
        '422':
          description: Unprocessable entity.
        '400':
          description: When the Request body structure is wrong.
  /api/2/projects/{projectKey}/cycles/{cycleKey}/defects:
    post:
      tags:
        - Defects
      summary: Returns the assigned defect of the test cycle structure.
      description: This endpoint returns the assigned defect of the test cycle structure. Only application admin, project admin or user with project roles can use this call. JWT Permission = "ReadProjectDefectsAndTheirAssignments"
      operationId: getAssignedDefects
      security:
        - SessionToken: [ ]
        - JWTAuth: [ "ReadProjectDefectsAndTheirAssignments" ]
      parameters:
        - name: projectKey
          in: path
          description: The identifier of the project.
          required: true
          schema:
            type: integer
            format: int64
        - name: cycleKey
          in: path
          description: The identifier of the test cycle.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: The cycle structure options.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleStructureOptions'
      responses:
        '200':
          description: The assigned defect of the test cycle structure have been returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignedDefect'
        '404':
          description: project or cycle not found.
        '422':
          description: tree root uid, filter or test theme uid invalid.

  /api/2/projects/{projectKey}/executionResults:
    post:
      tags:
        - Import
      summary: Uploads a zip archive containing the json based execution results.
      description: This endpoint uploads a zip archive that contains the json based execution results. Only application admin, manager or tester can use this call. JWT Permission = "ImportExecutionResults"
      operationId: uploadExecutionResults
      security:
        - SessionToken: [ ]
        - JWTAuth: [ "ImportExecutionResults"]
      parameters:
        - name: projectKey
          in: path
          description: The identifier of the project.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: The execution import file.
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: The file has been uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
        '404':
          description: Project not found.
        '403':
          description: Forbidden.
        '422':
          description: Unprocessable entity.

  /api/2/projects/{projectKey}/cycles/{cycleKey}/simulate-import:
    post:
      tags:
        - Import
      summary: Simulates the json based execution results in the given zip archive.
      description: This endpoint simulates the json based execution results to retrieve the test structure elements subject of check-in. Only application admin, manager or tester can use this call.
      operationId: simulateExecutionResults
      security:
        - SessionToken: [ ]
      parameters:
        - name: projectKey
          in: path
          description: The identifier of the project.
          required: true
          schema:
            type: integer
            format: int64
        - name: cycleKey
          in: path
          description: The identifier of the test cycle.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: The execution simulate options.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionImportSimulationOptions"
      responses:
        '200':
          description: The test structure elements subject of check-in are returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestStructureElement"
        '404':
          description: Project or test cycle not found.
        '403':
          description: Forbidden.
        '422':
          description: Unprocessable entity.
        '400':
          description: Malformed request body, or both 'filters' and 'filtering' were provided.

  /api/2/projects/{projectKey}/cycles/{cycleKey}/import:
    post:
      tags:
        - Import
      summary: Imports the json based execution results in the given zip archive.
      description: This endpoint imports the json based execution results. Only application admin, manager or tester can use this call. JWT Permission = "ImportExecutionResults"
      operationId: importExecutionResults
      security:
        - SessionToken: [ ]
        - JWTAuth: [ "ImportExecutionResults" ]
      parameters:
        - name: projectKey
          in: path
          description: The identifier of the project.
          required: true
          schema:
            type: integer
            format: int64
        - name: cycleKey
          in: path
          description: The identifier of the test cycle.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: The execution import options.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionImportOptions'
      responses:
        '200':
          description: The created job have been returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedJob'
        '404':
          description: Project or test cycle not found.
        '403':
          description: Forbidden.
        '422':
          description: Unprocessable entity.
        '400':
          description: Malformed request body, or both 'filters' and 'filtering' were provided.

  /api/2/projects/{projectKey}/import/job/{jobId}:
    get:
      tags:
        - Import
      summary: Returns the details of the given background importing job.
      description: This endpoint returns the details of the given background importing job. Only the owner of the job can use this call. JWT Permission = "ReadExecutionImportingJobDetails"
      operationId: getImportingJob
