openapi: 3.0.0
info:
  title: REST API Documentation
  description: TestBench WebServer.
  version: '4.2.0.1'
  contact:
    name: TestBench WebServer
components:
  securitySchemes:
    SessionToken:
      type: apiKey
      description: For authentication, provide a session token.
      in: header
      name: Authorization
    JWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TestElementStatus:
      type: string
      enum:
        - InProgress
        - Released
    ContentType:
      type: string
      enum:
        - txt
        - xml
    ReferenceUpdateMode:
      type: string
      enum:
        - Replace
        - Extend
    DefaultValue:
      type: object
      required:
        - name
        - valueType
      properties:
        name:
          type: string
        valueType:
          $ref: '#/components/schemas/ArgumentValueType'
    AdvancedContent:
      type: object
      properties:
        contentType:
          $ref: '#/components/schemas/ContentType'
        contentExtID:
          type: string
        content:
          type: string
    KeywordDetails:
      type: object
      required:
        - key
        - name
        - uniqueID
        - status
        - defaultCallType
        - description
        - path
        - parameters
        - preConditions
        - postConditions
        - references
      properties:
        key:
          type: string
          x-scalaType: persistence.models.alias.KeywordKey
        name:
          type: string
        uniqueID:
          type: string
        status:
          $ref: '#/components/schemas/TestElementStatus'
        defaultCallType:
          $ref: '#/components/schemas/KeywordCallType'
        locker:
          $ref: '#/components/schemas/UserReference'
        description:
          type: string
        version:
          type: string
          nullable: true
        parentUniqueID:
          type: string
        libraryKey:
          type: string
          x-scalaType: persistence.models.SubdivisionKey
        advancedContent:
          $ref: '#/components/schemas/AdvancedContent'
        path:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParameterDetails'
        preConditions:
          type: array
          items:
            $ref: '#/components/schemas/ConditionSummary'
        postConditions:
          type: array
          items:
            $ref: '#/components/schemas/ConditionSummary'
        references:
          type: array
          items:
            type: string
            x-scalaType: persistence.models.ReferenceKey
    SubdivisionDetails:
      type: object
      required:
        - key
        - name
        - uniqueID
        - description
        - path
        - references
      properties:
        key:
          type: string
          x-scalaType: persistence.models.SubdivisionKey
        name:
          type: string
        uniqueID:
          type: string
        locker:
          $ref: '#/components/schemas/UserReference'
        description:
          type: string
        parentUniqueID:
          type: string
        libraryKey:
          type: string
          x-scalaType: persistence.models.SubdivisionKey
        path:
          type: string
        references:
          type: array
          items:
            type: string
            x-scalaType: persistence.models.ReferenceKey
    KeywordForInsert:
      type: object
      required:
        - parentKey
        - name
        - parameters
      properties:
        parentKey:
          type: string
          x-scalaType: persistence.models.alias.KeywordParentKey
        name:
          type: string
        uid:
          type: string
        description:
          $ref: '#/components/schemas/RichTextInfo'
        advancedContent:
          $ref: '#/components/schemas/AdvancedContent'
        callType:
          $ref: '#/components/schemas/KeywordCallType'
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/KeywordParameterForInsert'
    SubdivisionForInsert:
      type: object
      required:
        - name
      properties:
        parentKey:
          type: string
          x-scalaType: persistence.models.SubdivisionParentKey
        name:
          type: string
        uid:
          type: string
        description:
          $ref: '#/components/schemas/RichTextInfo'
    SubdivisionForUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          $ref: '#/components/schemas/RichTextInfo'
    KeywordParameterForInsert:
      type: object
      required:
        - name
      properties:
        dataTypeKey:
          type: string
          x-scalaType: persistence.models.DataTypeKey
        name:
          type: string
        evaluationType:
          $ref: '#/components/schemas/ParameterEvaluationType'
    KeywordDetailsForUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          $ref: '#/components/schemas/RichTextInfo'
        callType:
          $ref: '#/components/schemas/KeywordCallType'
        locker:
          $ref: '#/components/schemas/OptionalUser'
        advancedContent:
          $ref: '#/components/schemas/OptionalAdvancedContent'
    OptionalAdvancedContent:
      type: object
      properties:
        optional:
          $ref: '#/components/schemas/AdvancedContent'
    OptionalUser:
      type: object
      properties:
        optional:
          type: string
          x-scalaType: persistence.models.UserKey
    ParameterDetails:
      type: object
      required:
        - key
        - name
        - definitionType
        - evaluationType
      properties:
        key:
          type: string
          x-scalaType: persistence.models.alias.KeywordParameterKey
        name:
          type: string
        definitionType:
          $ref: '#/components/schemas/ParameterDefinitionType'
        evaluationType:
          $ref: '#/components/schemas/ParameterEvaluationType'
        dataTypeKey:
          type: string
          x-scalaType: persistence.models.DataTypeKey
        defaultValue:
          $ref: '#/components/schemas/DefaultValue'
        signatureID:
          type: string
    SpecificationDetailsForUpdate:
      type: object
      properties:
        responsible:
          $ref: '#/components/schemas/OptionalUser'
        reviewer:
          $ref: '#/components/schemas/OptionalUser'
        locker:
          $ref: '#/components/schemas/OptionalUser'
        priority:
          $ref: '#/components/schemas/Priority'
        dueDate:
          $ref: '#/components/schemas/OptionalLocalDate'
        description:
          $ref: '#/components/schemas/RichTextInfo'
        reviewComment:
          $ref: '#/components/schemas/RichTextInfo'
    ProjectStatus:
      type: string
      enum:
        - Planned
        - Active
        - Finished
        - Closed
    DefectMetricType:
      type: string
      enum:
        - Status
        - Priority
        - Classification
    ProjectTreeNodeType:
      type: string
      enum:
        - Project
        - Version
        - Cycle
    Severity:
      type: string
      enum:
        - Information
        - Warning
        - Error
    UDFType:
      type: string
      enum:
        - String
        - Enumeration
        - Boolean
    TestLabelVisibilityType:
      type: string
      example: All
      default: All
      enum:
        - OnlyPrivate
        - OnlyPublic
        - All
    AutStatus:
      type: string
      enum:
        - NotPlanned
        - Planned
        - InProgress
        - InReview
        - Released
    SpecStatus:
      type: string
      enum:
        - NotPlanned
        - Planned
        - InProgress
        - InReview
        - Released
    Priority:
      type: string
      enum:
        - Undefined
        - Low
        - Middle
        - High
    ActivityStatus:
      type: string
      enum:
        - NotPlanned
        - Planned
        - Assigned
        - Running
        - Skipped
        - Canceled
        - Performed
    ExecStatus:
      type: string
      enum:
        - NotBlocked
        - Blocked
    VerdictStatus:
      type: string
      enum:
        - Undefined
        - ToVerify
        - Fail
        - Pass
    KeywordVerdict:
      type: string
      enum:
        - Pass
        - Fail
        - Skipped
        - ToVerify
        - Warn
        - Undefined
        - Blocked
    SequencePhase:
      type: string
      enum:
        - Setup
        - TestStep
        - Teardown
    KeywordCallType:
      type: string
      enum:
        - Flow
        - Check
    KeywordType:
      type: string
      enum:
        - Atomic
        - Compound
        - Textual
    OperationalState:
      type: string
      enum:
        - Enabled
        - Disabled
    GlobalHumanRole:
      type: string
      enum:
        - Administrator
        - ProjectAdministrator
        - ProjectUser
    ProjectRole:
      type: string
      enum:
        - TestManager
        - TestDesigner
        - TestProgrammer
        - Tester
        - ReadOnlyTestDesigner
        - ReadOnlyTestProgrammer
        - ReadOnlyTester
    TOVExchangeFormat:
      type: string
      enum:
        - xml
        - json
        - inherited
    ProjectExchangeFormat:
      type: string
      enum:
        - default_xml
        - default_json
    ImportResult:
      type: string
      enum:
        - Imported
        - PartiallyImported
        - NotImported
    ExecutionMode:
      type: string
      enum:
        - execute
        - continue
        - view
        - simulate
    UserGlobalRoles:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/GlobalHumanRole'
    UserProjectRolesAssignment:
      type: object
      required:
        - userKey
        - roles
      properties:
        userKey:
          type: string
          x-scalaType: persistence.models.UserKey
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ProjectRole'
    UserProjectRolesAssignments:
      type: object
      required:
        - assignments
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/UserProjectRolesAssignment'
    ProjectRoleUpdateStatus:
      type: string
      description: 'The per-user outcome of a batch project-role change: Applied (roles changed), Unchanged (already equal) or Failed (the error carries the cause).'
      enum:
        - Applied
        - Unchanged
        - Failed
    UserProjectRolesResult:
      type: object
      required:
        - userKey
        - status
        - roles
      properties:
        userKey:
          type: string
          x-scalaType: persistence.models.UserKey
        status:
          $ref: '#/components/schemas/ProjectRoleUpdateStatus'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ProjectRole'
        error:
          $ref: '#/components/schemas/ActionFailure'
    UserProjectRolesResults:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserProjectRolesResult'
    ProjectUser:
      type: object
      required:
        - key
        - login
        - name
        - projectRoles
      properties:
        key:
          type: string
          x-scalaType: persistence.models.UserKey
        name:
          type: string
        login:
          type: string
        projectRoles:
          type: array
          items:
            $ref: '#/components/schemas/ProjectRole'
    LicenseWarning:
      type: object
      required:
        - expiresSoon
        - baseCountExceeded
        - gracedForeignLicense
      properties:
        expiresSoon:
          type: boolean
        baseCountExceeded:
          type: boolean
        gracedForeignLicense:
          type: boolean
    LoginData:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
        password:
          type: string
        force:
          type: boolean
        context:
          type: string
    ChangePasswordData:
      type: object
      required:
        - login
        - password
        - newPassword
      properties:
        login:
          type: string
        password:
          type: string
        newPassword:
          type: string
    LoginSession:
      type: object
      required:
        - userKey
        - login
        - sessionToken
        - globalRoles
        - internalUserManagement
        - serverVersion
      properties:
        userKey:
          type: string
          x-scalaType: persistence.models.UserKey
        login:
          type: string
        sessionToken:
          type: string
        globalRoles:
          type: array
          items:
            type: string
        internalUserManagement:
          type: boolean
        serverVersion:
          type: string
        licenseWarning:
          $ref: '#/components/schemas/LicenseWarning'
    ActiveUser:
      type: object
      required:
        - login
        - contexts
      properties:
        login:
          type: string
        contexts:
          type: array
          items:
            type: string
    TestLabel:
      type: object
      required:
        - key
        - name
        - ownerKey
        - visibility
      properties:
        key:
          type: string
          x-scalaType: persistence.models.TestLabelKey
        name:
          type: string
        ownerKey:
          type: string
          x-scalaType: Option[persistence.models.UserKey]
        visibility:
          type: boolean
        libraryKey:
          type: string
          x-scalaType: persistence.models.SubdivisionKey
    TestLabelDataForUpdate:
      type: object
      properties:
        name:
          type: string
        visibility:
          type: boolean
    TestLabelDataForInsert:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        adaptName:
          type: boolean
          default: true
    ProjectMember:
      type: object
      required:
        - userKey
        - userLogin
        - userName
        - projectKey
        - projectName
        - roles
        - active
      properties:
        userKey:
          type: string
          x-scalaType: persistence.models.UserKey
        userLogin:
          type: string
        userName:
          type: string
        projectKey:
          type: string
          x-scalaType: persistence.models.ProjectKey
        projectName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ProjectRole'
        active:
          type: boolean
          description: 'Whether the user account is active. Inactive (deactivated) members are only returned to callers that may see inactive users (administrators and project administrators).'

    UserInfo:
      type: object
      required:
        - userKey
        - userLogin
        - userName
      properties:
        userKey:
          type: string
          x-scalaType: persistence.models.UserKey
        userLogin:
          type: string
        userName:
          type: string

    ProjectSummary:
      type: object
      required:
        - key
        - creationTime
        - name
        - status
        - visibility
        - tovsCount
        - cyclesCount
        - description
      properties:
        key:
          type: string
          x-scalaType: persistence.models.ProjectKey
        creationTime:
          type: string
          x-scalaType: java.time.OffsetDateTime
        name:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        visibility:
          type: boolean
        tovsCount:
          type: integer
          format: int32
        cyclesCount:
          type: integer
          format: int32
        description:
          type: string
        lockerKey:
          type: string
          x-scalaType: persistence.models.UserKey
        startDate:
          type: string
          x-scalaType: java.time.LocalDate
        endDate:
          type: string
          x-scalaType: java.time.LocalDate
    ProjectContext:
      type: object
      required:
        - tovName
      properties:
        tovName:
          type: string
        cycleName:
          type: string
        executionMode:
          $ref: '#/components/schemas/ExecutionMode'
    ProjectDetails:
      type: object
      required:
        - key
        - creationTime
        - name
        - status
        - visibility
        - tovsCount
        - cyclesCount
        - description
        - exchangeFormat
      properties:
        key:
          type: string
          x-scalaType: persistence.models.ProjectKey
        creationTime:
          type: string
          x-scalaType: java.time.OffsetDateTime
        name:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        visibility:
          type: boolean
        tovsCount:
          type: integer
          format: int32
        cyclesCount:
          type: integer
          format: int32
        description:
          type: string
        lockerKey:
          type: string
          x-scalaType: persistence.models.UserKey
        startDate:
          type: string
          x-scalaType: java.time.LocalDate
        endDate:
          type: string
          x-scalaType: java.time.LocalDate
        projectContext:
          $ref: '#/components/schemas/ProjectContext'
        exchangeFormat:
          $ref: '#/components/schemas/ProjectExchangeFormat'
    ProjectDetailsForUpdate:
      type: object
      properties:
        name:
          type: string
        testObjectName:
          type: string
        id:
          type: string
        customerName:
          type: string
        customerAddress:
          type: string
        contactPerson:
          type: string
        testLab:
          type: string
        placeOfInspection:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        isVisibleToTester:
          type: boolean
        description:
          $ref: '#/components/schemas/RichTextInfo'
        startDate:
          $ref: '#/components/schemas/OptionalLocalDate'
        endDate:
          $ref: '#/components/schemas/OptionalLocalDate'
        inspections:
          type: array
          items:
            type: string
            x-scalaType: persistence.models.InspectionDefinitionKey
        variantsManagementEnabled:
          $ref: '#/components/schemas/OperationalState'
    ProjectInspection:
      type: object
      required:
        - inspectionKey
        - severity
      properties:
        inspectionKey:
          type: string
          x-scalaType: persistence.models.InspectionDefinitionKey
        severity:
          $ref: '#/components/schemas/Severity'
    ProjectCustomer:
      type: object
      required:
        - customerName
        - customerAddress
        - testLab
        - placeOfInspection
        - contactPerson
      properties:
        customerName:
          type: string
        customerAddress:
          type: string
        testLab:
          type: string
        placeOfInspection:
          type: string
        contactPerson:
          type: string
    ProjectCreation:
      type: object
      discriminator:
        propertyName: type
    UnknownProject:
      allOf:
        - $ref: '#/components/schemas/ProjectCreation'
        - type: object
    NewProject:
      allOf:
        - $ref: '#/components/schemas/ProjectCreation'
        - type: object
    ProjectImported:
      allOf:
        - $ref: '#/components/schemas/ProjectCreation'
        - type: object
          required:
            - project
          properties:
            project:
              type: string
    TOVCreation:
      type: object
      discriminator:
        propertyName: type
    UnknownTOV:
      allOf:
        - $ref: '#/components/schemas/TOVCreation'
        - type: object
    NewTOV:
      allOf:
        - $ref: '#/components/schemas/TOVCreation'
        - type: object
    TOVCloned:
      allOf:
        - $ref: '#/components/schemas/TOVCreation'
        - type: object
          required:
            - tov
          properties:
            tov:
              type: string
            tovKey:
              type: string
              x-scalaType: persistence.models.TOVKey
    TOVClonedFromSameProject:
      allOf:
        - $ref: '#/components/schemas/TOVCreation'
        - type: object
          required:
            - tov
          properties:
            tov:
              type: string
            tovKey:
              type: string
              x-scalaType: persistence.models.TOVKey
    TOVClonedFromDifferentProject:
      allOf:
        - $ref: '#/components/schemas/TOVCreation'
        - type: object
          required:
            - project
            - tov
          properties:
            project:
              type: string
            tov:
              type: string
            tovKey:
              type: string
              x-scalaType: persistence.models.TOVKey
    TOVImportedAsNew:
      allOf:
        - $ref: '#/components/schemas/TOVCreation'
        - type: object
          required:
            - project
            - tov
          properties:
            project:
              type: string
            tov:
              type: string
    TOVImportedAsClone:
      allOf:
        - $ref: '#/components/schemas/TOVCreation'
        - type: object
          required:
            - project
            - tov
            - tovCloned
          properties:
            project:
              type: string
            tov:
              type: string
            tovCloned:
              type: string
    TOVImportedAsNewFromPlugin:
      allOf:
        - $ref: '#/components/schemas/TOVCreation'
        - type: object
          required:
            - plugin
            - tov
          properties:
            plugin:
              type: string
            tov:
              type: string
    TOVImportedAsCloneFromPlugin:
      allOf:
        - $ref: '#/components/schemas/TOVCreation'
        - type: object
          required:
            - plugin
            - tov
            - tovCloned
          properties:
            plugin:
              type: string
            tov:
              type: string
            tovCloned:
              type: string
    TOVImported:
      allOf:
        - $ref: '#/components/schemas/TOVCreation'
        - type: object
          required:
            - project
            - tov
          properties:
            project:
              type: string
            tov:
              type: string
    TOVDerivedFromSameProject:
      allOf:
        - $ref: '#/components/schemas/TOVCreation'
        - type: object
          required:
            - baseTOV
            - variantsDefinition
          properties:
            baseTOV:
              type: string
            variantsDefinition:
              type: string
            baseTOVKey:
              type: string
              x-scalaType: persistence.models.TOVKey
            variantsDefinitionKey:
              type: string
              x-scalaType: persistence.models.VariantsDefinitionKey
    TOVDerivedFromDifferentProject:
      allOf:
        - $ref: '#/components/schemas/TOVCreation'
        - type: object
          required:
            - project
            - baseTOV
            - variantsDefinition
          properties:
            project:
              type: string
            baseTOV:
              type: string
            variantsDefinition:
              type: string
            baseTOVKey:
              type: string
              x-scalaType: persistence.models.TOVKey
            variantsDefinitionKey:
              type: string
              x-scalaType: persistence.models.VariantsDefinitionKey

    ProjectDetailsResponse:
      type: object
      required:
        - projectKey
        - name
        - inspection
        - testObjectName
        - id
        - customer
        - status
        - visible
        - description
        - creation
        - instantOfCreation
        - onlyAdminsMayManageUDFs
        - variantsManagementEnabled
        - exchangeFormat
      properties:
        projectKey:
          type: string
          x-scalaType: persistence.models.ProjectKey
        name:
          type: string
        inspection:
          type: array
          items:
            $ref: '#/components/schemas/ProjectInspection'
        testObjectName:
          type: string
        id:
          type: string
        customer:
          $ref: '#/components/schemas/ProjectCustomer'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        visible:
          type: boolean
        description:
          type: string
        creation:
          $ref: '#/components/schemas/ProjectCreation'
        startDate:
          type: string
          x-scalaType: java.time.LocalDate
        endDate:
          type: string
          x-scalaType: java.time.LocalDate
        instantOfCreation:
          type: string
          x-scalaType: java.time.OffsetDateTime
        onlyAdminsMayManageUDFs:
          type: boolean
        variantsManagementEnabled:
          type: string
        exchangeFormat:
          $ref: '#/components/schemas/ProjectExchangeFormat'
    TOVSummary:
      type: object
      required:
        - key
        - creationTime
        - name
        - status
        - visibility
        - cyclesCount
        - description
        - exchangeFormat
      properties:
        key:
          type: string
          x-scalaType: persistence.models.TOVKey
        creationTime:
          type: string
          x-scalaType: java.time.OffsetDateTime
        name:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        visibility:
          type: boolean
        cyclesCount:
          type: integer
          format: int32
        description:
          type: string
        lockerKey:
          type: string
          x-scalaType: persistence.models.UserKey
        startDate:
          type: string
          x-scalaType: java.time.LocalDate
        endDate:
          type: string
          x-scalaType: java.time.LocalDate
        exchangeFormat:
          $ref: '#/components/schemas/TOVExchangeFormat'
    TOVDetails:
      type: object
      required:
        - key
        - creationTime
        - name
        - status
        - visibility
        - cyclesCount
        - description
        - exchangeFormat
      properties:
        key:
          type: string
          x-scalaType: persistence.models.TOVKey
        creationTime:
          type: string
          x-scalaType: java.time.OffsetDateTime
        name:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        visibility:
          type: boolean
        cyclesCount:
          type: integer
          format: int32
        description:
          type: string
        lockerKey:
          type: string
          x-scalaType: persistence.models.UserKey
        startDate:
          type: string
          x-scalaType: java.time.LocalDate
        endDate:
          type: string
          x-scalaType: java.time.LocalDate
        exchangeFormat:
          $ref: '#/components/schemas/TOVExchangeFormat'
    TOVForUpdate:
      type: object
      properties:
        name:
