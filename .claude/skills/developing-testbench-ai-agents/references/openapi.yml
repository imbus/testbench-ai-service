      tags:
        - Projects
      summary: Returns a single member of the given project.
      description: This endpoint returns the given user's membership (roles and active flag) in the given project. Only application admin, project admin or a user with project roles can use this call. A user that holds no role in the project is returned with an empty role list. A deactivated user is only returned to callers that may see inactive users (admins, project admins); for everyone else, and for users that do not exist, a Not Found is returned. JWT Permission = "ReadProjectMembers"
      operationId: getProjectMember
      security:
