          description: User successfully deleted.
        '403':
          description: Missing global role Administrator.
        '404':
          description: User not found.
        '409':
          description: >
            Conflict: The action to delete a user is not possible due to one of the following reasons:
              - The external user management (LDAP) is activated.
              - Attempting to delete own account.
              - The target user is logged-in.
              - The target user has some project roles and the parameter 'force' is set to false (or not set).
              - The target user is referenced in a checked in version.
              - The target user has global filters and the parameter 'force' is set to false (or not set).
              - The target user has public labels.
              - The target user is the last editor of a defect.
